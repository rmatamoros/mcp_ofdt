name: mcp-image

# Construye la imagen del servidor MCP y la publica en GHCR
# (ghcr.io/<owner>/ofdt-mcp). En los PR y en workflow_dispatch fuera de main
# solo construye y prueba.
#   push a main     -> latest y sha-<commit>
#   tag mcp-vX.Y.Z  -> X.Y.Z y X.Y, sin mover latest (debe coincidir con package.json)
on:
  push:
    branches: [main]
    tags: ['mcp-v*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: mcp-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ofdt-mcp

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Pruebas unitarias
        run: npm test

      - name: Verificar version del tag
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        run: |
          tag="${GITHUB_REF_NAME#mcp-v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con package.json ($pkg)"
            exit 1
          fi

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest solo lo pone el push a main (type=raw abajo); sin esto un
          # tag mcp-v* tambien lo moveria, aunque sea de un commit viejo.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=mcp-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=mcp-v(\d+\.\d+)\.\d+,group=1
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=ofdt-mcp
            org.opencontainers.image.description=Servidor MCP para la API REST de Oracle Forms Dependency Tracker

      # Imagen amd64 local para la prueba de humo, antes de publicar.
      - name: Construir para prueba
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ofdt-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prueba de humo
        run: |
          test "$(docker run --rm --entrypoint id ofdt-mcp:ci -un)" = node
          docker run -d --name smoke -p 127.0.0.1:3000:3000 \
            -e MCP_TRANSPORT=http \
            -e OFDT_BASE_URL=https://example.invalid/ords/ofdt \
            -e OFDT_CLIENT_ID=ci -e OFDT_CLIENT_SECRET=ci \
            ofdt-mcp:ci
          for _ in $(seq 1 20); do curl -fs http://127.0.0.1:3000/healthz && break; sleep 0.5; done
          echo
          curl -fs http://127.0.0.1:3000/healthz >/dev/null || { docker logs smoke; exit 1; }
          docker rm -f smoke

      - name: Login en GHCR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/mcp-v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/mcp-v')
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
